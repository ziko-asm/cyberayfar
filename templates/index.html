<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERAYFAR SCANNER — İcazəli veb zəiflik skaneri</title>
<meta name="description" content="CYBERAYFAR — pulsuz, icazəli veb zəiflik skaneri (DAST). {{ yoxlama_sayi }} yoxlama növü: XSS, SQL Injection, təhlükəsizlik başlıqları, TLS və s. AZ / EN / RU.">
<meta name="theme-color" content="#03050a">
<link rel="canonical" href="{{ kok_url }}">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CYBERAYFAR">
<meta property="og:title" content="CYBERAYFAR SCANNER — İcazəli veb zəiflik skaneri">
<meta property="og:description" content="Öz saytını {{ yoxlama_sayi }} yoxlama növü ilə pulsuz skan et: XSS, SQLi, başlıqlar, TLS və s.">
<meta property="og:url" content="{{ kok_url }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="CYBERAYFAR SCANNER">
<meta name="twitter:description" content="Pulsuz, icazəli veb zəiflik skaneri — {{ yoxlama_sayi }} yoxlama növü, 3 dil.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --qara:#03050a; --panel:#0a0f17; --panel2:#0e141c; --kenar:#182534;
    --neon:#00ff9c; --cyan:#00e5ff; --metn:#c8e6d8; --solgun:#8fa3b5;
    --kritik:#ff2bd6; --yuksek:#ff3b5c; --orta:#ffb020; --asagi:#2f9bff; --info:#5f7385;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Share Tech Mono',monospace;background:var(--qara);color:var(--metn);
    min-height:100vh;padding:20px;overflow-x:hidden;position:relative}

  /* ---- Fon qatları ---- */
  #matrix{position:fixed;inset:0;z-index:-3;opacity:.10;pointer-events:none}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(circle at 50% 0%,rgba(0,255,156,.08),transparent 60%),
      linear-gradient(rgba(0,255,156,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,156,.025) 1px,transparent 1px);
    background-size:100% 100%,36px 36px,36px 36px}
  /* CRT scanline + flicker */
  .crt{position:fixed;inset:0;z-index:999;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay;animation:flicker 5s infinite}
  .crt::after{content:"";position:absolute;left:0;right:0;height:120px;
    background:linear-gradient(rgba(0,255,156,0),rgba(0,255,156,.07),rgba(0,255,156,0));
    animation:sweep 6s linear infinite}
  @keyframes sweep{0%{top:-120px}100%{top:100%}}
  @keyframes flicker{0%,100%{opacity:.5}48%{opacity:.5}49%{opacity:.75}50%{opacity:.4}51%{opacity:.7}52%{opacity:.5}}

  /* ---- Boot overlay ---- */
  #boot{position:fixed;inset:0;z-index:2000;background:#03050a;display:flex;align-items:center;justify-content:center;
    font-family:'VT323',monospace;transition:opacity .6s}
  #boot.gizle{opacity:0;pointer-events:none}
  #bootMetn{color:var(--neon);font-size:22px;line-height:1.6;white-space:pre;text-shadow:0 0 8px rgba(0,255,156,.6);
    max-width:90vw}
  #bootMetn .ok{color:var(--cyan)}
  .boot-kursor{display:inline-block;width:11px;height:20px;background:var(--neon);animation:yan .8s steps(2) infinite;vertical-align:-3px}

  .konteyner{max-width:900px;margin:0 auto;position:relative;z-index:1}

  .diller{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
  .diller button{background:var(--panel);border:1px solid var(--kenar);color:var(--solgun);
    padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:1px;transition:.15s}
  .diller button.aktiv{color:var(--qara);background:var(--neon);border-color:var(--neon);font-weight:bold;box-shadow:0 0 14px rgba(0,255,156,.5)}

  /* ---- Hero ---- */
  header{text-align:center;padding:14px 0 10px}
  .logo{display:inline-flex;align-items:center;gap:16px;justify-content:center}
  .logo svg{filter:drop-shadow(0 0 10px var(--neon));animation:nabz 3s ease-in-out infinite}
  @keyframes nabz{50%{filter:drop-shadow(0 0 20px var(--neon))}}
  h1.glitch{position:relative;font-family:'Orbitron',sans-serif;font-size:46px;font-weight:900;letter-spacing:4px;color:#fff;
    text-shadow:0 0 12px var(--neon),0 0 30px rgba(0,255,156,.5)}
  h1.glitch .c{color:var(--neon)}
  h1.glitch::before,h1.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;
    background:var(--qara);overflow:hidden;opacity:.85}
  h1.glitch::before{color:var(--cyan);animation:gl1 2.6s infinite linear alternate-reverse;clip-path:polygon(0 0,100% 0,100% 44%,0 44%)}
  h1.glitch::after{color:var(--kritik);animation:gl2 2s infinite linear alternate-reverse;clip-path:polygon(0 56%,100% 56%,100% 100%,0 100%)}
  @keyframes gl1{0%,88%,100%{transform:translateX(0)}90%{transform:translate(-3px,-1px)}94%{transform:translate(3px,1px)}}
  @keyframes gl2{0%,86%,100%{transform:translateX(0)}92%{transform:translate(3px,1px)}96%{transform:translate(-3px,-1px)}}
  .tagline{min-height:22px;margin-top:12px;color:var(--cyan);font-size:15px;letter-spacing:1px}
  .tagline .tw-kursor{display:inline-block;width:8px;height:15px;background:var(--cyan);vertical-align:-2px;animation:yan .8s steps(2) infinite}

  /* ---- Stats ---- */
  .stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
  .stat{flex:1;min-width:120px;max-width:200px;background:var(--panel);border:1px solid var(--kenar);
    border-radius:10px;padding:14px;text-align:center;position:relative;overflow:hidden}
  .stat .num{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:800;color:var(--neon);text-shadow:0 0 12px rgba(0,255,156,.5)}
  .stat .lab{font-size:12px;color:var(--solgun);letter-spacing:1px;margin-top:4px;text-transform:uppercase}

  /* ---- Terminal input ---- */
  .axtaris{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;align-items:stretch}
  .input-sarma{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--kenar);border-radius:8px;padding:0 14px;transition:.15s;overflow:hidden}
  .input-sarma:focus-within{border-color:var(--neon);box-shadow:0 0 0 2px rgba(0,255,156,.15),0 0 18px rgba(0,255,156,.12)}
  .prompt{color:var(--neon);font-size:15px;white-space:nowrap;user-select:none;opacity:.9;flex-shrink:0}
  .p-qisa{display:none}
  .axtaris input{flex:1;min-width:0;padding:15px 0;border:0;background:transparent;color:var(--neon);
    font-family:inherit;font-size:16px;outline:none;letter-spacing:1px}
  .axtaris button{padding:15px 26px;border:1px solid var(--neon);border-radius:8px;background:transparent;
    color:var(--neon);font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;
    cursor:pointer;transition:.15s;text-shadow:0 0 8px rgba(0,255,156,.6);white-space:nowrap}
  .axtaris button:hover{background:var(--neon);color:var(--qara);box-shadow:0 0 22px rgba(0,255,156,.6)}
  .axtaris button:disabled{opacity:.4;cursor:not-allowed}

  /* ---- Terminal (canlı irəliləmə) ---- */
  .terminal{display:none;position:relative;background:#030f0a;border:1px solid var(--kenar);border-radius:10px;
    padding:18px;margin-bottom:18px;font-size:13px;max-height:240px;overflow-y:auto;overflow-x:hidden}
  .terminal::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--neon),transparent);animation:tscan 1.6s linear infinite}
  @keyframes tscan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .terminal .setir{padding:2px 0;color:var(--solgun);white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;animation:setirGel .3s ease}
  @keyframes setirGel{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
  .terminal .setir.isliyir{color:var(--cyan)} .terminal .setir.bitdi{color:var(--neon)}
  .terminal .yan{color:var(--neon)}
  .kursor{display:inline-block;width:9px;height:14px;background:var(--neon);animation:yan 1s steps(2) infinite;vertical-align:middle}
  @keyframes yan{50%{opacity:0}}

  .netice{display:none}
  /* Terminal pəncərəsi + tablar */
  .term-pencere{background:var(--panel);border:1px solid var(--kenar);border-radius:12px;overflow:hidden;box-shadow:0 0 30px rgba(0,255,156,.07)}
  .term-bar{display:flex;align-items:center;gap:12px;padding:10px 15px;background:#070b11;border-bottom:1px solid var(--kenar)}
  .term-dots{display:flex;gap:7px}
  .term-dots i{width:11px;height:11px;border-radius:50%;display:inline-block}
  .term-dots i:nth-child(1){background:#ff5f56}.term-dots i:nth-child(2){background:#ffbd2e}.term-dots i:nth-child(3){background:#27c93f}
  .term-title{font-size:12px;color:var(--solgun);letter-spacing:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .term-title::before{content:"⬡ cyberayfar://";color:var(--neon);opacity:.85}
  .tablar{display:flex;gap:2px;background:#070b11;border-bottom:1px solid var(--kenar);padding:0 8px;overflow-x:auto}
  .tab{background:transparent;border:0;border-bottom:2px solid transparent;color:var(--solgun);padding:13px 18px;
    font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:1px;cursor:pointer;white-space:nowrap;transition:.15s}
  .tab:hover{color:var(--metn)}
  .tab.aktiv{color:var(--neon);border-bottom-color:var(--neon);text-shadow:0 0 8px rgba(0,255,156,.5)}
  .tab-pane{display:none;padding:22px;animation:fadeIn .3s ease}
  .tab-pane.acik{display:block}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .bolme-ayri{margin-top:18px;padding-top:18px;border-top:1px dashed var(--kenar)}
  .panel{background:var(--panel);border:1px solid var(--kenar);border-radius:12px;padding:20px;margin-bottom:16px;position:relative}
  /* animasiyalı neon kənar */
  .panel.isiq::after{content:"";position:absolute;inset:-1px;border-radius:12px;padding:1px;pointer-events:none;
    background:linear-gradient(120deg,transparent,rgba(0,255,156,.5),transparent,rgba(0,229,255,.4),transparent);
    background-size:300% 300%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;animation:kenar 4s linear infinite}
  @keyframes kenar{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .xulase{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .bal-qutu{position:relative;width:108px;height:108px;flex-shrink:0;display:grid;place-items:center}
  .bal-ring{position:absolute;inset:0}
  #balArc{transition:stroke-dashoffset 1.1s cubic-bezier(.4,0,.2,1),stroke .4s;filter:drop-shadow(0 0 6px currentColor)}
  .bal-qutu.doldu{animation:halqaNabz 2.5s ease-in-out infinite}
  @keyframes halqaNabz{50%{filter:drop-shadow(0 0 10px var(--neon))}}
  .bal-ici{text-align:center;z-index:1}
  .bal-ici .reqem{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:800;color:#fff;line-height:1}
  .bal-ici .qiymet{font-size:13px;color:var(--neon);letter-spacing:2px;margin-top:2px}
  .xulase-metn{flex:1;min-width:180px}
  .xulase-metn h2{font-size:16px;color:#fff;margin-bottom:6px;word-break:break-all}
  .xulase-metn .stat-x{color:var(--solgun);font-size:13px;margin-bottom:8px}
  .tech-chip{display:inline-block;font-size:11px;color:var(--cyan);border:1px solid var(--kenar);border-radius:5px;padding:2px 8px;margin:2px 4px 2px 0}

  .icmal-bash,.yox-bash{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px;color:var(--cyan);margin-bottom:14px;text-transform:uppercase}
  .giris-qutu{margin:-6px 0 14px}
  .giris-ac{display:flex;align-items:flex-start;gap:8px;width:100%;background:none;border:0;text-align:left;font-family:inherit;
    color:var(--cyan);font-size:13px;cursor:pointer;user-select:none;padding:10px 2px;letter-spacing:.5px;border-radius:6px}
  .giris-ac #girisOx{flex-shrink:0}
  .giris-qeyd{font-size:12px;color:var(--solgun);line-height:1.5;padding:2px 2px 0}
  .giris-ac:hover{color:var(--neon)}
  .giris-sahe{display:none;flex-direction:column;gap:8px;margin-top:8px}
  .giris-sahe.acik{display:flex}
  .giris-sahe input{padding:12px 14px;border-radius:8px;border:1px solid var(--kenar);
    background:var(--panel);color:var(--neon);font-family:inherit;font-size:14px;outline:none}
  .giris-sahe input:focus{border-color:var(--neon)}
  .auth-chip{display:inline-block;font-size:11px;color:#03050a;background:var(--neon);
    border-radius:5px;padding:2px 8px;margin:2px 4px 2px 0;font-weight:bold}
  .icmal-ust{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .icmal-sag{flex:1;min-width:220px}
  #donut{flex-shrink:0;animation:donutGel .6s cubic-bezier(.2,.8,.2,1) both}
  @keyframes donutGel{from{opacity:0;transform:scale(.7) rotate(-20deg)}to{opacity:1;transform:none}}
  .donut-merkez{font-family:'Orbitron',sans-serif;font-weight:800}
  .cip-sira{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .cip{border:0;font-family:inherit;font-size:12px;padding:5px 11px;border-radius:7px;color:#fff;font-weight:bold;letter-spacing:.5px;cursor:pointer;transition:.15s;user-select:none}
  .cip:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .cip.sol{opacity:.28}
  .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--kenar)}
  .bar span{display:block;height:100%}
  .eylemler{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .eylemler button{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:9px 15px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;transition:.15s}
  .eylemler button:hover{background:var(--cyan);color:var(--qara);box-shadow:0 0 16px rgba(0,229,255,.4)}

  .yox-setir{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--kenar);font-size:14px}
  .yox-setir:last-child{border-bottom:0}
  .yox-ikon{width:22px;text-align:center;font-weight:bold}
  .yox-ad{flex:1}
  .yox-status{font-size:11px;letter-spacing:1px;padding:2px 10px;border-radius:999px}
  .yox-temiz .yox-ikon{color:var(--neon)} .yox-temiz .yox-status{color:var(--neon);border:1px solid var(--neon)}
  .yox-namelum .yox-ikon{color:var(--orta)} .yox-namelum .yox-status{color:var(--orta);border:1px solid var(--orta)}
  .yox-zeif .yox-ikon{color:var(--yuksek)} .yox-zeif .yox-status{color:var(--yuksek);border:1px solid var(--yuksek)}

  .filtr-info{background:none;border:0;padding:4px 0;font-family:inherit;text-align:left;font-size:12px;color:var(--cyan);margin-bottom:10px;display:none;cursor:pointer}
  .tapinti{background:var(--panel);border:1px solid var(--kenar);border-left-width:4px;border-radius:10px;padding:15px 17px;margin-bottom:11px;animation:ac .45s ease both;transition:transform .15s,box-shadow .15s}
  .tapinti:hover{transform:translateX(3px)}
  .tapinti.kritik:hover{box-shadow:-4px 0 18px rgba(255,43,214,.3)}
  .tapinti.yuksek:hover{box-shadow:-4px 0 18px rgba(255,59,92,.3)}
  @keyframes ac{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .tapinti .bash{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  .nisan{font-size:11px;font-weight:bold;padding:3px 9px;border-radius:5px;color:var(--qara);letter-spacing:1px}
  .cvss-rozet{font-size:10px;color:var(--solgun);border:1px solid var(--kenar);border-radius:4px;padding:2px 6px}
  .owasp-chip{font-size:10px;color:var(--cyan);border:1px solid var(--cyan);border-radius:4px;padding:2px 6px;font-weight:bold}
  .tapinti h3{font-size:15px;color:#fff}
  .tapinti .s2{font-size:12px;color:var(--cyan);margin:4px 0;word-break:break-all}
  .tapinti .izah{font-size:13px;margin:6px 0;color:var(--metn)}
  .tapinti .hell{font-size:12px;color:var(--neon);background:rgba(0,255,156,.07);padding:8px 11px;border-radius:7px;margin-top:8px;border:1px solid rgba(0,255,156,.2)}
  .kritik{border-left-color:var(--kritik)} .kritik .nisan{background:var(--kritik)}
  .yuksek{border-left-color:var(--yuksek)} .yuksek .nisan{background:var(--yuksek)}
  .orta{border-left-color:var(--orta)} .orta .nisan{background:var(--orta)}
  .asagi{border-left-color:var(--asagi)} .asagi .nisan{background:var(--asagi)}
  .info{border-left-color:var(--info)} .info .nisan{background:var(--info);color:#fff}
  .temiz-msg{text-align:center;padding:30px;color:var(--neon);font-size:16px;text-shadow:0 0 12px rgba(0,255,156,.4)}
  .xeta{display:none;background:rgba(255,59,92,.08);border:1px solid var(--yuksek);border-radius:10px;padding:15px;color:#ff8ea0;white-space:pre-wrap;margin-bottom:16px}
  .xeberdarliq{display:none;margin-top:16px;background:rgba(255,176,32,.08);border:1px solid var(--orta);border-radius:10px;
    padding:13px 15px;color:#ffd08a;font-size:13px;line-height:1.55}
  .qeyd-chip{color:var(--solgun);border-style:dashed;cursor:help}
  /* Klaviatura fokusu həmişə görünsün */
  button:focus-visible,a:focus-visible,.giris-sahe input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  footer{text-align:center;color:var(--solgun);font-size:12px;padding:30px 0;letter-spacing:1px}

  /* Hərəkəti azalt seçimi: animasiyalar və fon effektləri sönür */
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
    #matrix,.crt{display:none}
  }
  @media print{
    #matrix,.crt,body::before,#boot,.diller,.axtaris,.stats,.tagline,.terminal,.eylemler,footer,.tablar,.term-bar,.giris-qutu{display:none!important}
    .term-pencere{border:0;box-shadow:none}
    .tab-pane{display:block!important;padding:0;animation:none}
    body{background:#fff;color:#111;padding:0}
    .panel,.tapinti{background:#fff;border:1px solid #ccc;color:#111}
    .panel.isiq::after{display:none}
    .tapinti h3,.xulase-metn h2,.bal-ici .reqem{color:#111}
    h1.glitch{color:#111;text-shadow:none}h1.glitch::before,h1.glitch::after{display:none}
  }
  /* ===== TABLET / böyük telefon ===== */
  @media(max-width:768px){
    h1.glitch{font-size:38px}
    .stat{min-width:0;max-width:none}
  }
  /* ===== TELEFON (iPhone, Android) ===== */
  @media(max-width:600px){
    body{padding:14px}
    .konteyner{max-width:100%}
    h1.glitch{font-size:30px;letter-spacing:2px}
    .logo{gap:10px}.logo svg{width:38px;height:38px}
    .tagline{font-size:13px}
    .stats{gap:8px}
    .stat{flex:1 1 0;padding:11px 6px}
    .stat .num{font-size:20px}.stat .lab{font-size:10px;letter-spacing:.5px}
    .axtaris{flex-direction:column;gap:10px}
    .input-sarma{flex:1 1 auto;width:100%}
    .axtaris button{width:100%;padding:14px}
    .p-uzun{display:none}.p-qisa{display:inline}
    .prompt{font-size:14px}
    .panel{padding:16px}
    .bal-qutu,.bal-ring{width:94px;height:94px}
    .bal-ici .reqem{font-size:26px}
    .icmal-ust{gap:14px;justify-content:center}
    #donut{width:100px;height:100px}
    .tapinti{padding:13px 14px}
    .cip-sira{justify-content:center}
    #bootMetn{font-size:16px}
    .diller button{min-width:44px;min-height:44px}
  }
  /* ===== KİÇİK / köhnə telefon (iPhone SE, ~320px) ===== */
  @media(max-width:380px){
    body{padding:11px}
    h1.glitch{font-size:23px;letter-spacing:1px}
    .logo{gap:8px}.logo svg{width:32px;height:32px}
    .tagline{font-size:12px}
    .stat{padding:9px 4px}
    .stat .num{font-size:17px}.stat .lab{font-size:9px}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function xetaMetni(x){
  const t=UI[dil];
  if(x.kod==='sahiblik'&&x.token) return t.xeta_sahiblik.replace(/\{domen\}/g,x.domen||'').replace(/\{token\}/g,x.token);
  if(x.kod==='qosulma') return t.xeta_qosulma+(x.elave?': '+x.elave:'');
  return t['xeta_'+x.kod]||t.xeta_skan;
}
function xetaRender(){
  const el=$('xeta');
  if(!sonXeta){el.style.display='none';el.textContent='';return;}
  el.textContent=xetaMetni(sonXeta); el.style.display='block';
}

function dilDeyis(y){
  if(!UI[y])y='az';
  dil=y;
  try{localStorage.setItem('cyb_dil',y);}catch(e){}
  document.querySelectorAll('.diller button').forEach(b=>{const a=b.dataset.dil===y;b.classList.toggle('aktiv',a);b.setAttribute('aria-pressed',a);});
  document.documentElement.lang=y;
  const t=UI[y];
  if(!skanGedir)$('skanBtn').textContent=t.skan;
  $('footer').textContent=t.footer;
  $('yoxBash').textContent=t.yoxlamalar;
  $('icmalBash').textContent=t.icmal;
  $('btnJson').textContent=t.json;
  $('btnPdf').textContent=t.pdf;
  $('stLab1').textContent=t.st[0];
  $('stLab2').textContent=t.st[1];
  $('stLab3').textContent=t.st[2];
  $('girisBash').textContent=t.giris;
  $('girisQeyd').textContent=t.giris_qeyd;
  $('hedef').setAttribute('aria-label',t.lbl_hedef);
  [['loginUrl',t.ph_login],['istifadeci',t.ph_user],['parol',t.ph_parol]].forEach(([id,m])=>{$(id).placeholder=m;$(id).setAttribute('aria-label',m);});
  document.querySelector('.diller').setAttribute('aria-label',t.lbl_dil);
  typewriterBasla();
  xetaRender();
  if(sonNetice) neticeGoster(sonNetice);
}

// ============ SKAN (POST + axın: real irəliləmə, parol URL-də getmir) ============
async function skanBasla(){
  const hedef=$('hedef').value.trim();
  if(!hedef){$('hedef').focus();return;}
  if(skanGedir)return;
  const btn=$('skanBtn'),term=$('terminal');
  skanGedir=true; sonNetice=null; sonXeta=null; xetaRender(); $('netice').style.display='none';
  term.style.display='block'; term.innerHTML=''; btn.disabled=true; btn.textContent=UI[dil].skan_edilir;
  let addimlar=[], bitdi=false;
  function termRender(){
    term.innerHTML=addimlar.map((a,i)=>{const son=i===addimlar.length-1;
      const cls=a.bitdi?'bitdi':(son?'isliyir':'bitdi'); const ikon=a.bitdi?'✓':(son?'▶':'✓');
      const k=(son&&!a.bitdi)?'<span class="kursor"></span>':'';
      return `<div class="setir ${cls}"><span class="yan">[${ikon}]</span> ${esc(UI[dil].addim[a.kod]||a.kod)} ${k}</div>`;}).join('');
    term.scrollTop=term.scrollHeight;
  }
  function bitir(){bitdi=true;skanGedir=false;btn.disabled=false;btn.textContent=UI[dil].skan;term.style.display='none';}
  function xetaGoster(x){bitir();sonXeta=x;xetaRender();$('xeta').scrollIntoView({block:'nearest'});}
  function neticeHazir(d){bitir();sonNetice=d;neticeGoster(d);$('netice').scrollIntoView({block:'start'});}
  const xetaObyekti=d=>({kod:d.xeta_kod||'skan',domen:d.domen,token:d.token});
  function hadise(d){
    if(d.tip==='ilerleme'){
      if(d.addim==='bitdi')return;
      if(addimlar.length)addimlar[addimlar.length-1].bitdi=true;
      addimlar.push({kod:d.addim,bitdi:false});termRender();
    }
    else if(d.tip==='netice')neticeHazir(d.data);
    else if(d.tip==='xeta')xetaGoster(xetaObyekti(d));
  }

  const govde={hedef};
  const auser=$('istifadeci').value.trim(), apass=$('parol').value;
  if(auser&&apass)Object.assign(govde,{istifadeci:auser,parol:apass,login_url:$('loginUrl').value.trim()});

  try{
    const r=await fetch('/api/skan-stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(govde)});
    if(!r.ok||!(r.headers.get('content-type')||'').includes('text/event-stream')){
      let d={}; try{d=await r.json();}catch(e){}
      xetaGoster(xetaObyekti(d)); return;
    }
    const oxucu=r.body.getReader(), dec=new TextDecoder(); let buf='';
    while(!bitdi){
      const {done,value}=await oxucu.read(); if(done)break;
      buf+=dec.decode(value,{stream:true});
      let i;
      while(!bitdi&&(i=buf.indexOf('\n\n'))>=0){
        const blok=buf.slice(0,i); buf=buf.slice(i+2);
        const setir=blok.split('\n').filter(s=>s.startsWith('data:')).map(s=>s.slice(5).trim()).join('');
        if(!setir)continue;
        let d; try{d=JSON.parse(setir);}catch(e){continue;}
        hadise(d);
      }
    }
    if(!bitdi)xetaGoster({kod:'qosulma'});   // axın nəticəsiz kəsildi
  }catch(e){
    if(!bitdi)xetaGoster({kod:'qosulma',elave:e.message});
  }
}

function cssReng(ad){return getComputedStyle(document.documentElement).getPropertyValue(ad).trim();}
function balRengi(b){return cssReng(b>=75?'--neon':b>=40?'--orta':'--yuksek');}

function neticeGoster(d){
  const t=UI[dil], nat=!!d.natamam||d.bal==null, bal=nat?0:d.bal;
  const reng=nat?cssReng('--orta'):balRengi(bal);
  $('balQiymet').textContent=t.qiymet+' '+(nat?'?':d.qiymet);
  $('balQiymet').style.color=reng;
  // Animasiyalı halqa (dolur) + rəqəm count-up
  const arc=$('balArc'), C=301.6;
  arc.style.stroke=reng; arc.style.strokeDashoffset=C;
  requestAnimationFrame(()=>{arc.style.strokeDashoffset=C*(1-Math.max(0,Math.min(100,bal))/100);});
  document.querySelector('.bal-qutu').classList.toggle('doldu',!nat);
  const rq=$('balReqem'); let n=0;
  if(window._balT)clearInterval(window._balT);
  if(nat)rq.textContent='?';
  else if(AZ_HEREKET)rq.textContent=bal;
  else window._balT=setInterval(()=>{n+=Math.max(1,Math.ceil(bal/28));if(n>=bal){n=bal;clearInterval(window._balT);}rq.textContent=n;},34);

  // Natamam skan: "təmiz" demirik, səbəbini açıq yazırıq
  const xb=$('xeberdarliq');
  if(nat){xb.textContent=t.natamam.replace('{status}',d.natamam_status==null?t.cavab_yox:('HTTP '+d.natamam_status));xb.style.display='block';}
  else xb.style.display='none';

  $('xHedef').textContent=d.hedef;
  $('xStat').textContent=`${d.statistika.sehifeler} ${t.sehife} · ${d.statistika.formalar} ${t.forma} · ${d.tapintilar.length} ${t.netice}`;
  const tex=d.texnologiya||{}, texler=(tex.texnologiyalar||[]).map(String); let texHtml='';
  // Server adı artıq texnologiya siyahısındadırsa, iki dəfə göstərmə
  const srv=String(tex.server||'');
  if(srv&&srv!=='?'&&!texler.some(x=>srv.toLowerCase().includes(x.toLowerCase()))) texHtml+=`<span class="tech-chip">⚙ ${esc(srv)}</span>`;
  texler.forEach(x=>texHtml+=`<span class="tech-chip">${esc(x)}</span>`);
  if(d.auth_edildi) texHtml=`<span class="auth-chip">🔓 ${esc(t.authli)}</span>`+texHtml;
  if(d.headless===false) texHtml+=`<span class="tech-chip qeyd-chip" title="${esc(t.statik_izah)}">${esc(t.statik)}</span>`;
  $('xTech').innerHTML=texHtml;

  aktivFiltr=null;
  const ic=d.icmal||{}; const sira=['kritik','yuksek','orta','asagi','info'];
  $('cipSira').innerHTML=sira.map(s=>ic[s]?`<button type="button" class="cip" data-sev="${s}" aria-pressed="false" style="background:${RENG[s]};color:${s==='info'?'#fff':'#03050a'}">${esc(t.nisan[s])}: ${Number(ic[s])}</button>`:'').join('');
  const cem=sira.reduce((a,s)=>a+(ic[s]||0),0)||1;
  $('icmalBar').innerHTML=sira.map(s=>ic[s]?`<span style="background:${RENG[s]};width:${ic[s]/cem*100}%"></span>`:'').join('')||`<span style="background:var(${nat?'--orta':'--neon'});width:100%"></span>`;
  donutGoster(ic,sira,nat);

  $('yoxListe').innerHTML=d.yoxlamalar.map(y=>{const tm=y.status==='temiz';
    const cls=tm?(nat?'yox-namelum':'yox-temiz'):'yox-zeif', ikon=tm?(nat?'?':'✓'):'⚠';
    const st=tm?(nat?t.namelum:t.temiz):t.zeif;
    return `<div class="yox-setir ${cls}"><span class="yox-ikon">${ikon}</span><span class="yox-ad">${esc(t.kat[y.kat]||y.kat)}</span><span class="yox-status">${esc(st)}${y.say>0?' ('+Number(y.say)+')':''}</span></div>`;}).join('');

  // OWASP Top 10
  const ow=d.owasp_icmal||{}, owAd=d.owasp_adlar||{}, owK=Object.keys(ow).sort();
  const owP=$('owaspPanel');
  if(owK.length){
    $('owaspListe').innerHTML=owK.map(k=>`<div class="yox-setir yox-zeif"><span class="yox-ikon">⚠</span><span class="yox-ad"><b>${esc(k)}</b> — ${esc((owAd[k]&&owAd[k][dil])||'')}</span><span class="yox-status">${Number(ow[k])}</span></div>`).join('');
    owP.style.display='block';
  } else owP.style.display='none';

  tapintilariGoster();
  $('termTitle').textContent='scan/'+(d.domen||'');
  $('tabXulase').textContent=t.tab_xulase;
  $('tabTapintilar').textContent=t.tab_tapintilar+' ('+d.tapintilar.length+')';
  $('tabYoxlamalar').textContent=t.tab_yoxlamalar;
  tabKec('xulase');
  $('netice').style.display='block';
}

function tabKec(t){
  document.querySelectorAll('.tab').forEach(b=>{const a=b.dataset.tab===t;b.classList.toggle('aktiv',a);b.setAttribute('aria-selected',a);});
  const hedef='pane'+t.charAt(0).toUpperCase()+t.slice(1);
  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.toggle('acik', p.id===hedef));
}

function donutGoster(ic,sira,nat){
  const cem=sira.reduce((a,s)=>a+(ic[s]||0),0);
  const R=46,C=2*Math.PI*R; let off=0,halq='';
  if(cem===0){halq=`<circle cx="58" cy="58" r="${R}" fill="none" stroke="${nat?'#ffb020':'#00ff9c'}" stroke-width="12"/>`;}
  else sira.forEach(s=>{if(!ic[s])return;const f=ic[s]/cem;
    halq+=`<circle cx="58" cy="58" r="${R}" fill="none" stroke="${RENG[s]}" stroke-width="12" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 58 58)"/>`;off+=f;});
  $('donut').innerHTML=halq+
    `<text x="58" y="55" text-anchor="middle" class="donut-merkez" fill="#fff" font-size="24">${cem}</text>`+
    `<text x="58" y="73" text-anchor="middle" fill="#8fa3b5" font-size="10">${esc(UI[dil].netice)}</text>`;
}

function filterEt(sev){
  aktivFiltr=(aktivFiltr===sev)?null:sev;
  document.querySelectorAll('.cip').forEach(c=>{c.classList.toggle('sol',!!aktivFiltr&&c.dataset.sev!==aktivFiltr);c.setAttribute('aria-pressed',c.dataset.sev===aktivFiltr);});
  tapintilariGoster();
  if(aktivFiltr)tabKec('tapintilar');
}

function tapintilariGoster(){
  if(!sonNetice)return;
  const t=UI[dil],qab=$('tapintilar'),finfo=$('filtrInfo');
  if(!sonNetice.tapintilar.length){qab.innerHTML=`<div class="temiz-msg">${esc(sonNetice.natamam?t.natamam_qisa:t.tapildi_yox)}</div>`;finfo.style.display='none';return;}
  let list=aktivFiltr?sonNetice.tapintilar.filter(x=>x.ciddilik===aktivFiltr):sonNetice.tapintilar;
  if(aktivFiltr){finfo.style.display='block';finfo.textContent=`⊗ ${t.nisan[aktivFiltr]} (${list.length}) — ${t.filtr_temizle}`;}
  else finfo.style.display='none';
  qab.innerHTML=list.map((tp,i)=>{const m=(tp.metn&&(tp.metn[dil]||tp.metn.az))||{};
    const sev=RENG[tp.ciddilik]?tp.ciddilik:'info', cv=Number(tp.cvss)||0;
    return `<div class="tapinti ${sev}" style="animation-delay:${Math.min(i*35,350)}ms"><div class="bash"><span class="nisan">${esc(t.nisan[sev])}</span>${cv?`<span class="cvss-rozet" title="${esc(tp.cvss_vektor||t.cvss_texmini)}">CVSS ${cv.toFixed(1)}${tp.cvss_vektor?'':' ~'}</span>`:''}${tp.owasp?`<span class="owasp-chip">${esc(tp.owasp)}</span>`:''}<h3>${esc(m.ad)}</h3></div><div class="s2">📍 ${esc(tp.yer)}</div><div class="izah">${esc(m.izah)}</div><div class="hell">💡 ${esc(t.hell)}: ${esc(m.hell)}</div></div>`;}).join('');
}

function jsonYukle(){
  if(!sonNetice)return;
  const blob=new Blob([JSON.stringify(sonNetice,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cyberayfar-'+(sonNetice.domen||'report').replace(/[^a-z0-9]/gi,'_')+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function girisToggle(){
  const s=$('girisSahe'), acik=s.classList.toggle('acik');
  $('girisOx').textContent=acik?'▴':'▾';
  $('girisAc').setAttribute('aria-expanded',acik);
}

// ============ Hadisələr (inline onclick YOXDUR — CSP nonce ilə uyğun) ============
document.querySelectorAll('.diller button').forEach(b=>b.addEventListener('click',()=>dilDeyis(b.dataset.dil)));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>tabKec(b.dataset.tab)));
$('skanBtn').addEventListener('click',skanBasla);

$('btnPdf').addEventListener('click',()=>window.print());
$('filtrInfo').addEventListener('click',()=>filterEt(null));

['hedef','loginUrl','istifadeci','parol'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')skanBasla();}));

// ============ TYPEWRITER tagline ============
function typewriterBasla(){
  if(twTimer){clearTimeout(twTimer);}
  const el=document.getElementById('twMetn'); let frazalar=UI[dil].tag, fi=0, ci=0, silir=false;
  function tik(){
    const soz=frazalar[fi];
    ci += silir?-1:1;
    el.textContent=soz.slice(0,ci);
    let gecikme=silir?35:65;
    if(!silir&&ci===soz.length){gecikme=1600;silir=true;}
    else if(silir&&ci===0){silir=false;fi=(fi+1)%frazalar.length;gecikme=250;}
    twTimer=setTimeout(tik,gecikme);
  }
  tik();
}

// ============ STATS count-up ============
function countUp(){
  document.querySelectorAll('.stat .num').forEach(el=>{
    const hedef=+el.dataset.hedef, son=el.dataset.son||''; let n=0;
    if(AZ_HEREKET){el.textContent=hedef+son;return;}
    const addim=Math.max(1,Math.round(hedef/40));
    const t=setInterval(()=>{n+=addim;if(n>=hedef){n=hedef;clearInterval(t);}el.textContent=n+son;},30);
  });
}

// ============ BOOT sekvensiyası ============
function bootBasla(){
  const boot=document.getElementById('boot'), el=document.getElementById('bootMetn');
  let gorundu=false;
  try{gorundu=sessionStorage.getItem('cyb_boot')==='1';}catch(e){}
  if(gorundu||AZ_HEREKET){boot.classList.add('gizle');countUp();typewriterBasla();return;}
  const setirler=[
    "> INITIALIZING CYBERAYFAR CORE",
    "> LOADING "+SAY+" SCAN MODULES ... <span class='ok'>[OK]</span>",
    "> ESTABLISHING SECURE CHANNEL ... <span class='ok'>[OK]</span>",
    "> AUTHORIZATION GATE ... <span class='ok'>[ARMED]</span>",
    "> <span class='ok'>ACCESS GRANTED</span>",
  ];
  let i=0, buf="";
  function yaz(){
    if(i<setirler.length){
      buf+=setirler[i]+"\n"; el.innerHTML=buf+'<span class="boot-kursor"></span>'; i++;
      setTimeout(yaz, 360);
    } else {
      setTimeout(()=>{boot.classList.add('gizle');try{sessionStorage.setItem('cyb_boot','1');}catch(e){}
        countUp();typewriterBasla();}, 650);
    }
  }
  yaz();
  boot.addEventListener('click',()=>{boot.classList.add('gizle');try{sessionStorage.setItem('cyb_boot','1');}catch(e){}countUp();typewriterBasla();});
}

// ============ MATRIX fon ============
(function(){
  const c=document.getElementById('matrix'),x=c.getContext('2d');
  let w,h,sutun,damla;
  function olcu(){w=c.width=innerWidth;h=c.height=innerHeight;sutun=Math.floor(w/14);damla=Array(sutun).fill(1);}
  if(AZ_HEREKET){c.style.display='none';return;}
  olcu();addEventListener('resize',olcu);
  const herf="01</>{}#$аяＣＹＢＥＲ01ｱｲｳｴ10アイウエオカ".split('');
  function cek(){x.fillStyle='rgba(3,5,10,.07)';x.fillRect(0,0,w,h);
    x.fillStyle='#00ff9c';x.font='14px monospace';
    for(let i=0;i<damla.length;i++){const t=herf[Math.floor(Math.random()*herf.length)];
      x.fillText(t,i*14,damla[i]*14);if(damla[i]*14>h&&Math.random()>.975)damla[i]=0;damla[i]++;}}
  // Tab gizli olanda çəkmə (batareya/CPU)
  let tm=null;
  const basla=()=>{if(!tm)tm=setInterval(cek,55);}, dayan=()=>{clearInterval(tm);tm=null;};
  document.addEventListener('visibilitychange',()=>document.hidden?dayan():basla());
  if(!document.hidden)basla();
})();

let basDil='az';
try{basDil=localStorage.getItem('cyb_dil')||'';}catch(e){}
if(!UI[basDil]){const b=(navigator.language||'az').slice(0,2).toLowerCase();basDil=UI[b]?b:'az';}
dilDeyis(basDil);
bootBasla();
