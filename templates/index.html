<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERAYFAR SCANER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --qara:#03050a; --panel:#0a0f17; --panel2:#0e141c; --kenar:#182534;
    --neon:#00ff9c; --cyan:#00e5ff; --metn:#c8e6d8; --solgun:#5f7385;
    --kritik:#ff2bd6; --yuksek:#ff3b5c; --orta:#ffb020; --asagi:#2f9bff; --info:#5f7385;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Share Tech Mono',monospace;background:var(--qara);color:var(--metn);
    min-height:100vh;padding:20px;overflow-x:hidden;position:relative}

  /* ---- Fon qatları ---- */
  #matrix{position:fixed;inset:0;z-index:-3;opacity:.10;pointer-events:none}
  body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
    background:radial-gradient(circle at 50% 0%,rgba(0,255,156,.08),transparent 60%),
      linear-gradient(rgba(0,255,156,.025) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,156,.025) 1px,transparent 1px);
    background-size:100% 100%,36px 36px,36px 36px}
  /* CRT scanline + flicker */
  .crt{position:fixed;inset:0;z-index:999;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.14) 3px,rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay;animation:flicker 5s infinite}
  .crt::after{content:"";position:absolute;left:0;right:0;height:120px;
    background:linear-gradient(rgba(0,255,156,0),rgba(0,255,156,.07),rgba(0,255,156,0));
    animation:sweep 6s linear infinite}
  @keyframes sweep{0%{top:-120px}100%{top:100%}}
  @keyframes flicker{0%,100%{opacity:.5}48%{opacity:.5}49%{opacity:.75}50%{opacity:.4}51%{opacity:.7}52%{opacity:.5}}

  /* ---- Boot overlay ---- */
  #boot{position:fixed;inset:0;z-index:2000;background:#03050a;display:flex;align-items:center;justify-content:center;
    font-family:'VT323',monospace;transition:opacity .6s}
  #boot.gizle{opacity:0;pointer-events:none}
  #bootMetn{color:var(--neon);font-size:22px;line-height:1.6;white-space:pre;text-shadow:0 0 8px rgba(0,255,156,.6);
    max-width:90vw}
  #bootMetn .ok{color:var(--cyan)}
  .boot-kursor{display:inline-block;width:11px;height:20px;background:var(--neon);animation:yan .8s steps(2) infinite;vertical-align:-3px}

  .konteyner{max-width:900px;margin:0 auto;position:relative;z-index:1}

  .diller{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
  .diller button{background:var(--panel);border:1px solid var(--kenar);color:var(--solgun);
    padding:5px 11px;border-radius:6px;cursor:pointer;font-family:inherit;font-size:12px;letter-spacing:1px;transition:.15s}
  .diller button.aktiv{color:var(--qara);background:var(--neon);border-color:var(--neon);font-weight:bold;box-shadow:0 0 14px rgba(0,255,156,.5)}

  /* ---- Hero ---- */
  header{text-align:center;padding:14px 0 10px}
  .logo{display:inline-flex;align-items:center;gap:16px;justify-content:center}
  .logo svg{filter:drop-shadow(0 0 10px var(--neon));animation:nabz 3s ease-in-out infinite}
  @keyframes nabz{50%{filter:drop-shadow(0 0 20px var(--neon))}}
  h1.glitch{position:relative;font-family:'Orbitron',sans-serif;font-size:46px;font-weight:900;letter-spacing:4px;color:#fff;
    text-shadow:0 0 12px var(--neon),0 0 30px rgba(0,255,156,.5)}
  h1.glitch .c{color:var(--neon)}
  h1.glitch::before,h1.glitch::after{content:attr(data-text);position:absolute;top:0;left:0;width:100%;
    background:var(--qara);overflow:hidden;opacity:.85}
  h1.glitch::before{color:var(--cyan);animation:gl1 2.6s infinite linear alternate-reverse;clip-path:polygon(0 0,100% 0,100% 44%,0 44%)}
  h1.glitch::after{color:var(--kritik);animation:gl2 2s infinite linear alternate-reverse;clip-path:polygon(0 56%,100% 56%,100% 100%,0 100%)}
  @keyframes gl1{0%,88%,100%{transform:translateX(0)}90%{transform:translate(-3px,-1px)}94%{transform:translate(3px,1px)}}
  @keyframes gl2{0%,86%,100%{transform:translateX(0)}92%{transform:translate(3px,1px)}96%{transform:translate(-3px,-1px)}}
  .tagline{min-height:22px;margin-top:12px;color:var(--cyan);font-size:15px;letter-spacing:1px}
  .tagline .tw-kursor{display:inline-block;width:8px;height:15px;background:var(--cyan);vertical-align:-2px;animation:yan .8s steps(2) infinite}

  /* ---- Stats ---- */
  .stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 6px}
  .stat{flex:1;min-width:120px;max-width:200px;background:var(--panel);border:1px solid var(--kenar);
    border-radius:10px;padding:14px;text-align:center;position:relative;overflow:hidden}
  .stat .num{font-family:'Orbitron',sans-serif;font-size:28px;font-weight:800;color:var(--neon);text-shadow:0 0 12px rgba(0,255,156,.5)}
  .stat .lab{font-size:12px;color:var(--solgun);letter-spacing:1px;margin-top:4px;text-transform:uppercase}

  /* ---- Terminal input ---- */
  .axtaris{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;align-items:stretch}
  .input-sarma{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--kenar);border-radius:8px;padding:0 14px;transition:.15s;overflow:hidden}
  .input-sarma:focus-within{border-color:var(--neon);box-shadow:0 0 0 2px rgba(0,255,156,.15),0 0 18px rgba(0,255,156,.12)}
  .prompt{color:var(--neon);font-size:15px;white-space:nowrap;user-select:none;opacity:.9;flex-shrink:0}
  .p-qisa{display:none}
  .axtaris input{flex:1;min-width:0;padding:15px 0;border:0;background:transparent;color:var(--neon);
    font-family:inherit;font-size:16px;outline:none;letter-spacing:1px}
  .axtaris button{padding:15px 26px;border:1px solid var(--neon);border-radius:8px;background:transparent;
    color:var(--neon);font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:2px;
    cursor:pointer;transition:.15s;text-shadow:0 0 8px rgba(0,255,156,.6);white-space:nowrap}
  .axtaris button:hover{background:var(--neon);color:var(--qara);box-shadow:0 0 22px rgba(0,255,156,.6)}
  .axtaris button:disabled{opacity:.4;cursor:not-allowed}

  /* ---- Terminal (canlı irəliləmə) ---- */
  .terminal{display:none;position:relative;background:#030f0a;border:1px solid var(--kenar);border-radius:10px;
    padding:18px;margin-bottom:18px;font-size:13px;max-height:240px;overflow:auto}
  .terminal::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--neon),transparent);animation:tscan 1.6s linear infinite}
  @keyframes tscan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .terminal .setir{padding:2px 0;color:var(--solgun);white-space:pre-wrap}
  .terminal .setir.isliyir{color:var(--cyan)} .terminal .setir.bitdi{color:var(--neon)}
  .terminal .yan{color:var(--neon)}
  .kursor{display:inline-block;width:9px;height:14px;background:var(--neon);animation:yan 1s steps(2) infinite;vertical-align:middle}
  @keyframes yan{50%{opacity:0}}

  .netice{display:none}
  .panel{background:var(--panel);border:1px solid var(--kenar);border-radius:12px;padding:20px;margin-bottom:16px;position:relative}
  /* animasiyalı neon kənar */
  .panel.isiq::after{content:"";position:absolute;inset:-1px;border-radius:12px;padding:1px;pointer-events:none;
    background:linear-gradient(120deg,transparent,rgba(0,255,156,.5),transparent,rgba(0,229,255,.4),transparent);
    background-size:300% 300%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;animation:kenar 4s linear infinite}
  @keyframes kenar{0%{background-position:0% 50%}100%{background-position:300% 50%}}
  .xulase{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .bal-qutu{position:relative;width:108px;height:108px;flex-shrink:0;display:grid;place-items:center}
  .bal-dairesi{width:108px;height:108px;border-radius:50%;position:absolute;inset:0;border:4px solid var(--neon)}
  .bal-ici{text-align:center;z-index:1}
  .bal-ici .reqem{font-family:'Orbitron',sans-serif;font-size:32px;font-weight:800;color:#fff;line-height:1}
  .bal-ici .qiymet{font-size:13px;color:var(--neon);letter-spacing:2px;margin-top:2px}
  .xulase-metn{flex:1;min-width:180px}
  .xulase-metn h2{font-size:16px;color:#fff;margin-bottom:6px;word-break:break-all}
  .xulase-metn .stat-x{color:var(--solgun);font-size:13px;margin-bottom:8px}
  .tech-chip{display:inline-block;font-size:11px;color:var(--cyan);border:1px solid var(--kenar);border-radius:5px;padding:2px 8px;margin:2px 4px 2px 0}

  .icmal-bash,.yox-bash{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px;color:var(--cyan);margin-bottom:14px;text-transform:uppercase}
  .icmal-ust{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .icmal-sag{flex:1;min-width:220px}
  #donut{flex-shrink:0}
  .donut-merkez{font-family:'Orbitron',sans-serif;font-weight:800}
  .cip-sira{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .cip{font-size:12px;padding:5px 11px;border-radius:7px;color:#fff;font-weight:bold;letter-spacing:.5px;cursor:pointer;transition:.15s;user-select:none}
  .cip:hover{transform:translateY(-2px);filter:brightness(1.1)}
  .cip.sol{opacity:.28}
  .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--kenar)}
  .bar span{display:block;height:100%}
  .eylemler{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .eylemler button{background:transparent;border:1px solid var(--cyan);color:var(--cyan);padding:9px 15px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:13px;transition:.15s}
  .eylemler button:hover{background:var(--cyan);color:var(--qara);box-shadow:0 0 16px rgba(0,229,255,.4)}

  .yox-setir{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--kenar);font-size:14px}
  .yox-setir:last-child{border-bottom:0}
  .yox-ikon{width:22px;text-align:center;font-weight:bold}
  .yox-ad{flex:1}
  .yox-status{font-size:11px;letter-spacing:1px;padding:2px 10px;border-radius:999px}
  .yox-temiz .yox-ikon{color:var(--neon)} .yox-temiz .yox-status{color:var(--neon);border:1px solid var(--neon)}
  .yox-zeif .yox-ikon{color:var(--yuksek)} .yox-zeif .yox-status{color:var(--yuksek);border:1px solid var(--yuksek)}

  .filtr-info{font-size:12px;color:var(--cyan);margin-bottom:10px;display:none;cursor:pointer}
  .tapinti{background:var(--panel);border:1px solid var(--kenar);border-left-width:4px;border-radius:10px;padding:15px 17px;margin-bottom:11px;animation:ac .45s ease both}
  @keyframes ac{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .tapinti .bash{display:flex;align-items:center;gap:8px;margin-bottom:7px;flex-wrap:wrap}
  .nisan{font-size:11px;font-weight:bold;padding:3px 9px;border-radius:5px;color:var(--qara);letter-spacing:1px}
  .cvss-rozet{font-size:10px;color:var(--solgun);border:1px solid var(--kenar);border-radius:4px;padding:2px 6px}
  .tapinti h3{font-size:15px;color:#fff}
  .tapinti .s2{font-size:12px;color:var(--cyan);margin:4px 0;word-break:break-all}
  .tapinti .izah{font-size:13px;margin:6px 0;color:var(--metn)}
  .tapinti .hell{font-size:12px;color:var(--neon);background:rgba(0,255,156,.07);padding:8px 11px;border-radius:7px;margin-top:8px;border:1px solid rgba(0,255,156,.2)}
  .kritik{border-left-color:var(--kritik)} .kritik .nisan{background:var(--kritik)}
  .yuksek{border-left-color:var(--yuksek)} .yuksek .nisan{background:var(--yuksek)}
  .orta{border-left-color:var(--orta)} .orta .nisan{background:var(--orta)}
  .asagi{border-left-color:var(--asagi)} .asagi .nisan{background:var(--asagi)}
  .info{border-left-color:var(--info)} .info .nisan{background:var(--info);color:#fff}
  .temiz-msg{text-align:center;padding:30px;color:var(--neon);font-size:16px;text-shadow:0 0 12px rgba(0,255,156,.4)}
  .xeta{display:none;background:rgba(255,59,92,.08);border:1px solid var(--yuksek);border-radius:10px;padding:15px;color:#ff8ea0;white-space:pre-wrap;margin-bottom:16px}
  footer{text-align:center;color:var(--solgun);font-size:12px;padding:30px 0;letter-spacing:1px}

  @media print{
    #matrix,.crt,body::before,#boot,.diller,.axtaris,.stats,.tagline,.terminal,.eylemler,footer{display:none!important}
    body{background:#fff;color:#111;padding:0}
    .panel,.tapinti{background:#fff;border:1px solid #ccc;color:#111}
    .panel.isiq::after{display:none}
    .tapinti h3,.xulase-metn h2,.bal-ici .reqem{color:#111}
    h1.glitch{color:#111;text-shadow:none}h1.glitch::before,h1.glitch::after{display:none}
  }
  /* ===== TABLET / böyük telefon ===== */
  @media(max-width:768px){
    h1.glitch{font-size:38px}
    .stat{min-width:0;max-width:none}
  }
  /* ===== TELEFON (iPhone, Android) ===== */
  @media(max-width:600px){
    body{padding:14px}
    .konteyner{max-width:100%}
    h1.glitch{font-size:30px;letter-spacing:2px}
    .logo{gap:10px}.logo svg{width:38px;height:38px}
    .tagline{font-size:13px}
    .stats{gap:8px}
    .stat{flex:1 1 0;padding:11px 6px}
    .stat .num{font-size:20px}.stat .lab{font-size:10px;letter-spacing:.5px}
    .axtaris{flex-direction:column;gap:10px}
    .input-sarma{flex:1 1 auto;width:100%}
    .axtaris button{width:100%;padding:14px}
    .p-uzun{display:none}.p-qisa{display:inline}
    .prompt{font-size:14px}
    .panel{padding:16px}
    .bal-qutu,.bal-dairesi{width:94px;height:94px}
    .bal-ici .reqem{font-size:26px}
    .icmal-ust{gap:14px;justify-content:center}
    #donut{width:100px;height:100px}
    .tapinti{padding:13px 14px}
    .cip-sira{justify-content:center}
    #bootMetn{font-size:16px}
  }
  /* ===== KİÇİK / köhnə telefon (iPhone SE, ~320px) ===== */
  @media(max-width:380px){
    body{padding:11px}
    h1.glitch{font-size:23px;letter-spacing:1px}
    .logo{gap:8px}.logo svg{width:32px;height:32px}
    .tagline{font-size:12px}
    .stat{padding:9px 4px}
    .stat .num{font-size:17px}.stat .lab{font-size:9px}
    .diller button{padding:4px 8px;font-size:11px}
    .prompt{font-size:13px}
    .axtaris input{font-size:16px}
    .xulase-metn h2{font-size:14px}
    #bootMetn{font-size:14px}
  }
</style>
</head>
<body>
<div id="boot"><div id="bootMetn"></div></div>
<div class="crt"></div>
<canvas id="matrix"></canvas>

<div class="konteyner">
  <div class="diller">
    <button data-dil="az" class="aktiv" onclick="dilDeyis('az')">AZ</button>
    <button data-dil="en" onclick="dilDeyis('en')">EN</button>
    <button data-dil="ru" onclick="dilDeyis('ru')">RU</button>
  </div>

  <header>
    <div class="logo">
      <svg width="54" height="54" viewBox="0 0 48 48" fill="none">
        <path d="M24 3L6 10v12c0 11 7.6 18.9 18 23 10.4-4.1 18-12 18-23V10L24 3z" stroke="#00ff9c" stroke-width="2.5" fill="rgba(0,255,156,.06)"/>
        <path d="M16 24l6 6 10-12" stroke="#00ff9c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="glitch" data-text="CYBERAYFAR"><span class="c">CYBER</span>AYFAR</h1>
    </div>
    <div class="tagline"><span id="twMetn"></span><span class="tw-kursor"></span></div>
  </header>

  <div class="stats">
    <div class="stat"><div class="num" data-hedef="15" id="st1">0</div><div class="lab" id="stLab1">Yoxlama növü</div></div>
    <div class="stat"><div class="num" data-hedef="3" id="st2">0</div><div class="lab" id="stLab2">Dil</div></div>
    <div class="stat"><div class="num" data-hedef="100" data-son="%" id="st3">0</div><div class="lab" id="stLab3">Pulsuz</div></div>
  </div>

  <div class="axtaris">
    <div class="input-sarma">
      <span class="prompt"><span class="p-uzun">root@cyberayfar:~#</span><span class="p-qisa">~#</span></span>
      <input id="hedef" type="text" inputmode="url" placeholder="domen.com" value="saytyoxla.vercel.app" autocomplete="off">
    </div>
    <button id="skanBtn" onclick="skanBasla()">⚡ SKAN ET</button>
  </div>

  <div class="xeta" id="xeta"></div>
  <div class="terminal" id="terminal"></div>

  <div class="netice" id="netice">
    <div class="panel isiq xulase">
      <div class="bal-qutu">
        <div class="bal-dairesi" id="balDairesi"></div>
        <div class="bal-ici"><div class="reqem" id="balReqem">—</div><div class="qiymet" id="balQiymet"></div></div>
      </div>
      <div class="xulase-metn"><h2 id="xHedef"></h2><div class="stat-x" id="xStat"></div><div id="xTech"></div></div>
    </div>

    <div class="panel">
      <div class="icmal-bash" id="icmalBash">İcmal</div>
      <div class="icmal-ust">
        <svg id="donut" width="116" height="116" viewBox="0 0 116 116"></svg>
        <div class="icmal-sag"><div class="cip-sira" id="cipSira"></div><div class="bar" id="icmalBar"></div></div>
      </div>
      <div class="eylemler">
        <button onclick="jsonYukle()" id="btnJson">⬇ JSON yüklə</button>
        <button onclick="window.print()" id="btnPdf">🖨 PDF / Çap</button>
      </div>
    </div>

    <div class="panel">
      <div class="yox-bash" id="yoxBash">Aparılan Yoxlamalar</div>
      <div id="yoxListe"></div>
    </div>

    <div class="filtr-info" id="filtrInfo" onclick="filterEt(null)"></div>
    <div id="tapintilar"></div>
  </div>

  <footer id="footer">⚖️ Yalnız öz saytlarını və ya icazəli saytları skan et.</footer>
</div>

<script>
const UI = {
  az:{altbashlik:"İcazəli Veb Zəiflik Skaneri",skan:"⚡ SKAN ET",skan_edilir:"SKAN EDİLİR...",
    footer:"⚖️ Yalnız öz saytlarını və ya icazəli saytları skan et.",qiymet:"QİYMƏT",
    netice:"nəticə",sehife:"səhifə",forma:"forma",icmal:"İcmal",
    yoxlamalar:"Aparılan Yoxlamalar",temiz:"TƏMİZ",zeif:"ZƏİF",tapildi_yox:"✓ Heç bir açıq zəiflik tapılmadı!",
    hell:"Həll",json:"⬇ JSON yüklə",pdf:"🖨 PDF / Çap",xeta_qosulma:"Serverə qoşulma xətası",filtr_temizle:"filtri təmizlə",
    st:["Yoxlama növü","Dil","Pulsuz"],
    tag:["SQL Injection aşkarlanır...","XSS ovlanır...","15 hücum vektoru yoxlanılır...","Tap. Düzəlt. Qoru."],
    kat:{fayllar:"Həssas Fayllar",basliqlar:"Təhlükəsizlik Başlıqları",email:"Email / Spoofing",xss:"XSS",sqli:"SQL Injection",cmd:"Command Injection",lfi:"LFI / Path Traversal",redirect:"Open Redirect",cors:"CORS",kohne_js:"Köhnə JS Kitabxanalar",csrf:"CSRF",yollar:"Gizli Yollar",metodlar:"HTTP Metodları",mixed:"Mixed Content",subdomain:"Subdomenlər"},
    addim:{icaze:"İcazə yoxlanılır",crawl:"Sayt gəzilir (crawl)",texnologiya:"Texnologiya aşkarlanır",fayllar:"Həssas fayllar yoxlanılır",basliqlar:"Təhlükəsizlik başlıqları yoxlanılır",cors:"CORS yoxlanılır",kohne_js:"Köhnə JS kitabxanalar yoxlanılır",spoofing:"Domain spoofing yoxlanılır",xss:"XSS sınanılır",sqli:"SQL Injection sınanılır",redirect:"Open Redirect sınanılır",cmd:"Command Injection sınanılır",lfi:"LFI sınanılır",csrf:"CSRF yoxlanılır",metodlar:"HTTP metodları yoxlanılır",mixed:"Mixed content yoxlanılır",yollar:"Gizli yollar yoxlanılır",subdomain:"Subdomenlər axtarılır",bitdi:"Skan tamamlandı"},

const RENG={kritik:'#ff2bd6',yuksek:'#ff3b5c',orta:'#ffb020',asagi:'#2f9bff',info:'#5f7385'};
let dil='az', sonNetice=null, simTimer=null, aktivFiltr=null, twTimer=null;

function dilDeyis(y){
  dil=y;
  document.querySelectorAll('.diller button').forEach(b=>b.classList.toggle('aktiv',b.dataset.dil===y));
  document.documentElement.lang=y;
  const t=UI[y];
  document.getElementById('skanBtn').textContent=t.skan;
  document.getElementById('footer').textContent=t.footer;
  document.getElementById('yoxBash').textContent=t.yoxlamalar;
  document.getElementById('icmalBash').textContent=t.icmal;
  document.getElementById('btnJson').textContent=t.json;
  document.getElementById('btnPdf').textContent=t.pdf;
  document.getElementById('stLab1').textContent=t.st[0];
  document.getElementById('stLab2').textContent=t.st[1];
  document.getElementById('stLab3').textContent=t.st[2];
  typewriterBasla();
  if(sonNetice) neticeGoster(sonNetice);
}

// ============ SKAN (SSE + POST ehtiyat) ============
function skanBasla(){
  const hedef=document.getElementById('hedef').value.trim(); if(!hedef) return;
  const btn=document.getElementById('skanBtn'),term=document.getElementById('terminal'),
    netice=document.getElementById('netice'),xeta=document.getElementById('xeta');
  sonNetice=null; xeta.style.display='none'; netice.style.display='none';
  term.style.display='block'; term.innerHTML=''; btn.disabled=true; btn.textContent=UI[dil].skan_edilir;
  if(simTimer){clearInterval(simTimer);simTimer=null;}
  let addimlar=[], tamamlandi=false;
  function termRender(){
    term.innerHTML=addimlar.map((a,i)=>{const son=i===addimlar.length-1;
      const cls=a.bitdi?'bitdi':(son?'isliyir':'bitdi'); const ikon=a.bitdi?'✓':(son?'▶':'✓');
      const k=(son&&!a.bitdi)?'<span class="kursor"></span>':'';
      return `<div class="setir ${cls}"><span class="yan">[${ikon}]</span> ${UI[dil].addim[a.kod]||a.kod} ${k}</div>`;}).join('');
    term.scrollTop=term.scrollHeight;
  }
  function bitir(){btn.disabled=false;btn.textContent=UI[dil].skan;if(simTimer){clearInterval(simTimer);simTimer=null;}}
  function xetaGoster(m){tamamlandi=true;bitir();term.style.display='none';xeta.textContent=m;xeta.style.display='block';}
  function neticeHazir(d){tamamlandi=true;bitir();addimlar.forEach(a=>a.bitdi=true);termRender();sonNetice=d;neticeGoster(d);}
  function postFallback(){
    const sim=['icaze','crawl','texnologiya','fayllar','basliqlar','spoofing','xss','sqli','cmd','lfi'];let i=0;addimlar=[];
    simTimer=setInterval(()=>{if(i<sim.length){if(addimlar.length)addimlar[addimlar.length-1].bitdi=true;addimlar.push({kod:sim[i],bitdi:false});termRender();i++;}},600);
    fetch('/api/skan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({hedef})})
      .then(r=>r.json()).then(d=>{if(d.xeta)xetaGoster(d.xeta);else neticeHazir(d);})
      .catch(e=>xetaGoster(UI[dil].xeta_qosulma+': '+e.message));
  }
  const es=new EventSource('/api/skan-stream?hedef='+encodeURIComponent(hedef));
  es.onmessage=(ev)=>{const d=JSON.parse(ev.data);
    if(d.tip==='ilerleme'){if(d.addim==='bitdi')return;if(addimlar.length)addimlar[addimlar.length-1].bitdi=true;addimlar.push({kod:d.addim,bitdi:false});termRender();}
    else if(d.tip==='netice'){es.close();neticeHazir(d.data);}
    else if(d.tip==='xeta'){es.close();xetaGoster(d.mesaj);}};
  es.onerror=()=>{es.close();if(tamamlandi)return;addimlar=[];termRender();postFallback();};
}

function balRengi(b){return b>=75?getComputedStyle(document.documentElement).getPropertyValue('--neon'):b>=40?getComputedStyle(document.documentElement).getPropertyValue('--orta'):getComputedStyle(document.documentElement).getPropertyValue('--yuksek');}

function neticeGoster(d){
  const t=UI[dil], reng=balRengi(d.bal).trim();
  document.getElementById('balReqem').textContent=d.bal;
  document.getElementById('balQiymet').textContent=t.qiymet+' '+d.qiymet;
  const dr=document.getElementById('balDairesi');dr.style.borderColor=reng;dr.style.boxShadow=`0 0 20px ${reng}66,inset 0 0 20px ${reng}22`;
  document.getElementById('balQiymet').style.color=reng;
  document.getElementById('xHedef').textContent=d.hedef;
  document.getElementById('xStat').textContent=`${d.statistika.sehifeler} ${t.sehife} · ${d.statistika.formalar} ${t.forma} · ${d.tapintilar.length} ${t.netice}`;
  const tex=d.texnologiya||{}; let texHtml='';
  if(tex.server&&tex.server!=='?') texHtml+=`<span class="tech-chip">⚙ ${tex.server}</span>`;
  (tex.texnologiyalar||[]).forEach(x=>texHtml+=`<span class="tech-chip">${x}</span>`);
  document.getElementById('xTech').innerHTML=texHtml;

  aktivFiltr=null;
  const ic=d.icmal||{}; const sira=['kritik','yuksek','orta','asagi','info'];
  document.getElementById('cipSira').innerHTML=sira.map(s=>ic[s]?`<span class="cip" data-sev="${s}" onclick="filterEt('${s}')" style="background:${RENG[s]};color:${s==='info'?'#fff':'#03050a'}">${t.nisan[s]}: ${ic[s]}</span>`:'').join('');
  const cem=sira.reduce((a,s)=>a+(ic[s]||0),0)||1;
  document.getElementById('icmalBar').innerHTML=sira.map(s=>ic[s]?`<span style="background:${RENG[s]};width:${ic[s]/cem*100}%"></span>`:'').join('')||`<span style="background:var(--neon);width:100%"></span>`;
  donutGoster(ic,sira);

  document.getElementById('yoxListe').innerHTML=d.yoxlamalar.map(y=>{const tm=y.status==='temiz';
    return `<div class="yox-setir ${tm?'yox-temiz':'yox-zeif'}"><span class="yox-ikon">${tm?'✓':'⚠'}</span><span class="yox-ad">${t.kat[y.kat]||y.kat}</span><span class="yox-status">${tm?t.temiz:t.zeif}${y.say>0?' ('+y.say+')':''}</span></div>`;}).join('');

  tapintilariGoster();
  document.getElementById('netice').style.display='block';
}

function donutGoster(ic,sira){
  const cem=sira.reduce((a,s)=>a+(ic[s]||0),0);
  const R=46,C=2*Math.PI*R; let off=0,halq='';
  if(cem===0){halq=`<circle cx="58" cy="58" r="${R}" fill="none" stroke="#00ff9c" stroke-width="12"/>`;}
  else sira.forEach(s=>{if(!ic[s])return;const f=ic[s]/cem;
    halq+=`<circle cx="58" cy="58" r="${R}" fill="none" stroke="${RENG[s]}" stroke-width="12" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 58 58)"/>`;off+=f;});
  document.getElementById('donut').innerHTML=halq+
    `<text x="58" y="55" text-anchor="middle" class="donut-merkez" fill="#fff" font-size="24">${cem}</text>`+
    `<text x="58" y="73" text-anchor="middle" fill="#5f7385" font-size="10">${UI[dil].netice}</text>`;
}

function filterEt(sev){
  aktivFiltr=(aktivFiltr===sev)?null:sev;
  document.querySelectorAll('.cip').forEach(c=>c.classList.toggle('sol',aktivFiltr&&c.dataset.sev!==aktivFiltr));
  tapintilariGoster();
}

function tapintilariGoster(){
  if(!sonNetice)return;
  const t=UI[dil],qab=document.getElementById('tapintilar'),finfo=document.getElementById('filtrInfo');
  if(!sonNetice.tapintilar.length){qab.innerHTML=`<div class="temiz-msg">${t.tapildi_yox}</div>`;finfo.style.display='none';return;}
  let list=aktivFiltr?sonNetice.tapintilar.filter(x=>x.ciddilik===aktivFiltr):sonNetice.tapintilar;
  if(aktivFiltr){finfo.style.display='block';finfo.textContent=`⊗ ${t.nisan[aktivFiltr]} (${list.length}) — ${t.filtr_temizle}`;}
  else finfo.style.display='none';
  qab.innerHTML=list.map((tp,i)=>{const m=tp.metn[dil];
    return `<div class="tapinti ${tp.ciddilik}" style="animation-delay:${Math.min(i*35,350)}ms"><div class="bash"><span class="nisan">${t.nisan[tp.ciddilik]}</span>${tp.cvss?`<span class="cvss-rozet">CVSS ${tp.cvss.toFixed(1)}</span>`:''}<h3>${m.ad}</h3></div><div class="s2">📍 ${tp.yer}</div><div class="izah">${m.izah}</div><div class="hell">💡 ${t.hell}: ${m.hell}</div></div>`;}).join('');
}

function jsonYukle(){
  if(!sonNetice)return;
  const blob=new Blob([JSON.stringify(sonNetice,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='cyberayfar-'+(sonNetice.domen||'report').replace(/[^a-z0-9]/gi,'_')+'.json';a.click();
}
document.getElementById('hedef').addEventListener('keydown',e=>{if(e.key==='Enter')skanBasla();});

// ============ TYPEWRITER tagline ============
function typewriterBasla(){
  if(twTimer){clearTimeout(twTimer);}
  const el=document.getElementById('twMetn'); let frazalar=UI[dil].tag, fi=0, ci=0, silir=false;
  function tik(){
    const soz=frazalar[fi];
    ci += silir?-1:1;
    el.textContent=soz.slice(0,ci);
    let gecikme=silir?35:65;
    if(!silir&&ci===soz.length){gecikme=1600;silir=true;}
    else if(silir&&ci===0){silir=false;fi=(fi+1)%frazalar.length;gecikme=250;}
    twTimer=setTimeout(tik,gecikme);
  }
  tik();
}

// ============ STATS count-up ============
function countUp(){
  document.querySelectorAll('.stat .num').forEach(el=>{
    const hedef=+el.dataset.hedef, son=el.dataset.son||''; let n=0;
    const addim=Math.max(1,Math.round(hedef/40));
    const t=setInterval(()=>{n+=addim;if(n>=hedef){n=hedef;clearInterval(t);}el.textContent=n+son;},30);
  });
}

// ============ BOOT sekvensiyası ============
function bootBasla(){
  const boot=document.getElementById('boot'), el=document.getElementById('bootMetn');
  let gorundu=false;
  try{gorundu=sessionStorage.getItem('cyb_boot')==='1';}catch(e){}
  if(gorundu){boot.classList.add('gizle');countUp();typewriterBasla();return;}
  const setirler=[
    "> INITIALIZING CYBERAYFAR CORE",
    "> LOADING 15 ATTACK MODULES ... <span class='ok'>[OK]</span>",
    "> ESTABLISHING SECURE CHANNEL ... <span class='ok'>[OK]</span>",
    "> AUTHORIZATION GATE ... <span class='ok'>[ARMED]</span>",
    "> <span class='ok'>ACCESS GRANTED</span>",
  ];
  let i=0, buf="";
  function yaz(){
    if(i<setirler.length){
      buf+=setirler[i]+"\n"; el.innerHTML=buf+'<span class="boot-kursor"></span>'; i++;
      setTimeout(yaz, 360);
    } else {
      setTimeout(()=>{boot.classList.add('gizle');try{sessionStorage.setItem('cyb_boot','1');}catch(e){}
        countUp();typewriterBasla();}, 650);
    }
  }
  yaz();
  boot.addEventListener('click',()=>{boot.classList.add('gizle');try{sessionStorage.setItem('cyb_boot','1');}catch(e){}countUp();typewriterBasla();});
}

// ============ MATRIX fon ============
(function(){
  const c=document.getElementById('matrix'),x=c.getContext('2d');
  let w,h,sutun,damla;
  function olcu(){w=c.width=innerWidth;h=c.height=innerHeight;sutun=Math.floor(w/14);damla=Array(sutun).fill(1);}
  olcu();addEventListener('resize',olcu);
  const herf="01</>{}#$аяＣＹＢＥＲ01ｱｲｳｴ10アイウエオカ".split('');
  setInterval(()=>{x.fillStyle='rgba(3,5,10,.07)';x.fillRect(0,0,w,h);
    x.fillStyle='#00ff9c';x.font='14px monospace';
    for(let i=0;i<damla.length;i++){const t=herf[Math.floor(Math.random()*herf.length)];
      x.fillText(t,i*14,damla[i]*14);if(damla[i]*14>h&&Math.random()>.975)damla[i]=0;damla[i]++;}},55);
})();

bootBasla();
