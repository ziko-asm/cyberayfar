name: test

# Hər push və PR-da: unit testlər + laboratoriya benchmarkı
# (aşkarlama düşərsə və ya yalançı müsbət çıxarsa, build qırılır).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -q
